<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training App</title>

  <style>
    body {
      font-family: Arial;
      padding: 12px;
      max-width: 500px;
      margin: auto;
    }

    button {
      padding: 6px;
      margin: 3px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<h2>Training App</h2>

<div id="days"></div>
<div id="workouts"></div>

<script>
const WORKOUT_DAYS = {
  "Day 1": ["Incline DB Bench", "Landmine Press", "Lateral Raise"],
  "Day 2": ["RDL", "Reverse Lunge", "Hip Thrust"],
  "Day 3": ["Incline Walk"],
  "Day 4": ["Row", "Pulldown", "Face Pull"],
  "Day 5": ["Deadlift", "Front Squat", "Push Press"]
};

let currentDay = "Day 1";

function renderDays() {
  const container = document.getElementById("days");
  container.innerHTML = "";

  Object.keys(WORKOUT_DAYS).forEach(day => {
    const btn = document.createElement("button");
    btn.innerText = day;
    btn.onclick = () => {
      currentDay = day;
      renderWorkouts();
    };
    container.appendChild(btn);
  });
}

function logSet(exercise) {
  const weight = prompt("Weight?");
  const reps = prompt("Reps?");
  const rpe = prompt("RPE?");

  if (!weight || !reps) return;

  alert(exercise + "\\n" + weight + " x " + reps + " (RPE " + rpe + ")");
}

function renderWorkouts() {
  const container = document.getElementById("workouts");
  container.innerHTML = "";

  WORKOUT_DAYS[currentDay].forEach(ex => {
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("strong");
    title.innerText = ex;

    const btn = document.createElement("button");
    btn.innerText = "+ Add Set";
    btn.onclick = () => logSet(ex);

    card.appendChild(title);
    card.appendChild(document.createElement("br"));
    card.appendChild(btn);

    container.appendChild(card);
  });
}

renderDays();
renderWorkouts();
</script>

</body>
</html>
