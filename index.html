<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inner Strength</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inner Strength">
<link rel="apple-touch-icon" href="icon.png">

<style>
body {
  font-family: -apple-system, Arial;
  background: #f2f4f7;
  padding: 14px;
  max-width: 480px;
  margin: auto;
}

<div style="text-align:center; margin-bottom:10px;">
  <img src="logo.png" style="width:80px; border-radius:18px;">
  <h2 style="margin-top:6px;">Inner Strength</h2>
</div>
  text-align:center;
  margin-top:5px;
  margin-bottom:12px;
  font-weight:600;
}

button {
  border:none;
  border-radius:10px;
  padding:10px;
  margin:3px;
  background:#2563eb;
  color:white;
  font-size:14px;
}

.day-row {
  display:flex;
  overflow-x:auto;
  margin-bottom:10px;
}

.day-btn {
  background:#ddd;
  color:black;
}

.active {
  background:#2563eb;
  color:white;
}

.card {
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 6px 14px rgba(0,0,0,0.08);
}

.row {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.small {
  font-size:12px;
  color:#6b7280;
}

.info-box {
  background:#eef3ff;
  padding:10px;
  border-radius:10px;
  margin-top:8px;
}

.rpe-btn {
  background:#e5e7eb;
  color:black;
}

.rpe-active {
  background:#2563eb;
  color:white;
}
</style>

</head>

<body>

<div style="text-align:center;">
<img src="icon.png" width="70">
<h2>Inner Strength</h2>
</div>

<div id="app"></div>

<script>

const workouts = {
 "Day 1":[
  "Incline DB Bench (Neutral Grip)",
  "Half-Kneeling Landmine Press",
  "DB Fly (Short Range)",
  "Lateral Raise",
  "Triceps Pressdown"
 ],
 "Day 2":[
  "Goblet Squat to Box",
  "Romanian Deadlift",
  "Reverse Lunge",
  "Hip Thrust / Glute Bridge",
  "Pallof Press"
 ],
 "Day 3":[
  "Incline Treadmill Walk",
  "Kettlebell Swing"
 ],
 "Day 4":[
  "Chest-Supported DB Row",
  "Neutral-Grip Pulldown",
  "Face Pull",
  "Hammer Curl",
  "Farmer's Carry"
 ],
 "Day 5":[
  "Complex Deadlift",
  "Complex Row",
  "Complex Clean",
  "Complex Front Squat",
  "Complex Push Press",
  "Kettlebell Swing"
 ]
};

const info = {

"Incline DB Bench (Neutral Grip)":"Set bench to incline. Keep elbows slightly tucked. Control down, press through upper chest.",

"Half-Kneeling Landmine Press":"Stay upright, core tight. Press forward/up, avoid leaning back.",

"DB Fly (Short Range)":"Keep slight elbow bend. Lower only to safe stretch, squeeze chest at top.",

"Lateral Raise":"Raise arms to shoulder height. Lead with elbows. Slow on the way down.",

"Triceps Pressdown":"Elbows pinned to sides. Fully extend arms, slow return.",

"Goblet Squat to Box":"Sit back onto box. Keep chest tall and knees out.",

"Romanian Deadlift":"Push hips back. Keep bar close. Feel stretch in hamstrings.",

"Reverse Lunge":"Step back, drop straight down. Drive through front leg.",

"Hip Thrust / Glute Bridge":"Drive hips up. Pause at top. Squeeze glutes hard.",

"Pallof Press":"Press straight out. Resist rotation. Core tight.",

"Incline Treadmill Walk":"Stay upright. Steady pace. Controlled breathing.",

"Kettlebell Swing":"Hinge at hips. Explode forward. Arms relaxed.",

"Chest-Supported DB Row":"Pull elbows toward hips. Keep chest on bench.",

"Neutral-Grip Pulldown":"Pull to upper chest. Control upward phase.",

"Face Pull":"Pull toward face. Elbows high. Squeeze rear delts.",

"Hammer Curl":"Neutral grip. No swinging. Slow control.",

"Farmer's Carry":"Stand tall. Keep shoulders tight. Walk controlled.",

"Complex Deadlift":"Maintain tight position. Controlled lift.",

"Complex Row":"Pull bar to torso. Control descent.",

"Complex Clean":"Explosive hip drive. Catch smoothly.",

"Complex Front Squat":"Elbows high. Stay upright.",

"Complex Push Press":"Dip slightly then explode upward."
};

let logs = JSON.parse(localStorage.getItem("logs") || "{}");

let currentDay="Day 1";
let openInfo=null;

let current = { weight:100, reps:8, rpe:8, speed:3, incline:5 };

function toggleInfoSafe(btn){
 const ex = btn.getAttribute("data-exercise");
 openInfo = openInfo===ex ? null : ex;
 render();
}

function logSetSafe(btn){
 const ex = btn.getAttribute("data-exercise");
 logSet(ex);
}

function setDay(d){ currentDay=d; render(); }
function adjust(field,val){ current[field]+=val; render(); }

function isCardio(ex){
 return currentDay==="Day 3" && ex==="Incline Treadmill Walk";
}

function logSet(ex){
 if(!logs[currentDay]) logs[currentDay]={};
 if(!logs[currentDay][ex]) logs[currentDay][ex]=[];

 let entry = isCardio(ex)
 ? {speed:current.speed,incline:current.incline}
 : {weight:current.weight,reps:current.reps,rpe:current.rpe};

 logs[currentDay][ex].push(entry);
 localStorage.setItem("logs",JSON.stringify(logs));
 render();
}

function render(){

 let html="<div class='day-row'>";

 for(let d in workouts){
   html+=`<button class="day-btn ${d===currentDay?'active':''}" onclick="setDay('${d}')">${d}</button>`;
 }
 html+="</div>";

 workouts[currentDay].forEach(ex=>{

   html+=`<div class="card">`;

   html+=`
   <div class="row">
     <b>${ex}</b>
     <button onclick="toggleInfoSafe(this)" data-exercise="${ex}">ⓘ</button>
   </div>`;

   if(openInfo===ex){
     html+=`<div class="info-box">${info[ex]}</div>`;
   }

   let last = logs[currentDay]?.[ex]?.slice(-1)[0];

   if(last){
     html+=`<div class="small">
       Last: ${last.speed
         ? `${last.speed}/${last.incline}`
         : `${last.weight}x${last.reps}`}
     </div>`;
   }

   if(isCardio(ex)){
     html+=`
     Speed ${current.speed}
     <button onclick="adjust('speed',.1)">+</button>
     <button onclick="adjust('speed',-.1)">-</button><br>
     Incline ${current.incline}
     <button onclick="adjust('incline',1)">+</button>
     <button onclick="adjust('incline',-1)">-</button>`;
   } else {
     html+=`
     Weight ${current.weight}
     <button onclick="adjust('weight',5)">+</button>
     <button onclick="adjust('weight',-5)">-</button><br>
     Reps ${current.reps}
     <button onclick="adjust('reps',1)">+</button>
     <button onclick="adjust('reps',-1)">-</button><br>

     RPE:
     ${[6,7,8,9].map(r=>
       `<button class="${current.rpe===r?'rpe-active':'rpe-btn'}"
       onclick="current.rpe=${r};render()">${r}</button>`
     ).join("")}`;
   }

   html+=`<br><button onclick="logSetSafe(this)" data-exercise="${ex}">Track Set</button>`;
   html+=`</div>`;
 });

 document.getElementById("app").innerHTML=html;
}

render();

</script>
</body>
</html>
