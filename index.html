<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Training App</title>

<style>
body {
  font-family: -apple-system, Arial;
  max-width: 500px;
  margin: auto;
  padding: 12px;
  background: #f5f7fb;
}

h2 { text-align:center; }

button {
  border:none;
  border-radius:6px;
  padding:6px 8px;
  margin:3px;
  background:#2563eb;
  color:white;
  font-size:13px;
}

.day-btn { background:#ddd; color:black; }
.active { background:#2563eb; color:white; }

.card {
  background:white;
  border-radius:10px;
  padding:10px;
  margin-bottom:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.row {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.small { font-size:12px; color:#666; }

.info-box {
  background:#eef3ff;
  padding:8px;
  border-radius:6px;
  margin-top:6px;
}
</style>

</head>
<body>

<h2>🏋️ Training</h2>

<div>
<button onclick="view='workout';render()">Workout</button>
<button onclick="view='audit';render()">Audit</button>
</div>

<div id="app"></div>

<script>

const workouts = {
 "Day 1":[
  "Incline DB Bench (Neutral Grip)",
  "Half-Kneeling Landmine Press",
  "DB Fly (Short Range)",
  "Lateral Raise",
  "Triceps Pressdown"
 ],
 "Day 2":[
  "Goblet Squat to Box",
  "Romanian Deadlift",
  "Reverse Lunge",
  "Hip Thrust / Glute Bridge",
  "Pallof Press"
 ],
 "Day 3":[
  "Incline Treadmill Walk",
  "Kettlebell Swing"
 ],
 "Day 4":[
  "Chest-Supported DB Row",
  "Neutral-Grip Pulldown",
  "Face Pull",
  "Hammer Curl",
  "Farmer's Carry"
 ],
 "Day 5":[
  "Complex Deadlift",
  "Complex Row",
  "Complex Clean",
  "Complex Front Squat",
  "Complex Push Press",
  "Kettlebell Swing"
 ]
};

const info = {

"Incline DB Bench (Neutral Grip)": {
 instructions:"Upper chest press with neutral grip.",
 video:"https://www.youtube.com/watch?v=8iPEnn-ltC8"
},

"Half-Kneeling Landmine Press": {
 instructions:"Single-arm press from kneeling position.",
 video:"https://www.youtube.com/watch?v=H8kB1YI5l3M"
},

"DB Fly (Short Range)": {
 instructions:"Controlled chest fly with limited range.",
 video:"https://www.youtube.com/watch?v=eozdVDA78K0"
},

"Lateral Raise": {
 instructions:"Raise DBs to shoulder height.",
 video:"https://www.youtube.com/watch?v=3VcKaXpzqRo"
},

"Triceps Pressdown": {
 instructions:"Cable extension for triceps.",
 video:"https://www.youtube.com/watch?v=2-LAMcpzODU"
},

"Goblet Squat to Box": {
 instructions:"Sit back onto box, drive up.",
 video:"https://www.youtube.com/watch?v=6xwGFn-J_Q8"
},

"Romanian Deadlift": {
 instructions:"Hip hinge, stretch hamstrings.",
 video:"https://www.youtube.com/watch?v=jc1ogzTe1cA"
},

"Reverse Lunge": {
 instructions:"Step back and lower under control.",
 video:"https://www.youtube.com/watch?v=wrwwXE_x-pQ"
},

"Hip Thrust / Glute Bridge": {
 instructions:"Drive hips upward, squeeze glutes.",
 video:"https://www.youtube.com/watch?v=LM8XHLYJoYs"
},

"Pallof Press": {
 instructions:"Anti-rotation core exercise.",
 video:"https://www.youtube.com/watch?v=2yx0_PK0Q-4"
},

"Incline Treadmill Walk": {
 instructions:"Steady incline walking cardio.",
 video:"https://www.youtube.com/watch?v=8XjJb6y0JX0"
},

"Kettlebell Swing": {
 instructions:"Explosive hip hinge movement.",
 video:"https://www.youtube.com/watch?v=YSxHifyI1lA"
},

"Chest-Supported DB Row": {
 instructions:"Row with chest support, isolate back.",
 video:"https://www.youtube.com/watch?v=roCP6wCXPqo"
},

"Neutral-Grip Pulldown": {
 instructions:"Pull handles to chest.",
 video:"https://www.youtube.com/watch?v=CAwf7n6Luuc"
},

"Face Pull": {
 instructions:"Rear delt + upper back pull.",
 video:"https://www.youtube.com/watch?v=rep-qVOkqgk"
},

"Hammer Curl": {
 instructions:"Neutral grip arm curl.",
 video:"https://www.youtube.com/watch?v=zC3nLlEvin4"
},

"Farmer's Carry": {
 instructions:"Carry heavy weights, stay upright.",
 video:"https://www.youtube.com/watch?v=rt17lmnaLSM"
},

"Complex Deadlift": {
 instructions:"Start complex with hinge.",
 video:"https://www.youtube.com/watch?v=ytGaGIn3SjE"
},

"Complex Row": {
 instructions:"Pull from hinge position.",
 video:"https://www.youtube.com/watch?v=roCP6wCXPqo"
},

"Complex Clean": {
 instructions:"Explosive pull to shoulders.",
 video:"https://www.youtube.com/watch?v=KwYJTpQ_x5A"
},

"Complex Front Squat": {
 instructions:"Squat with front rack position.",
 video:"https://www.youtube.com/watch?v=tlf3A60GHvE"
},

"Complex Push Press": {
 instructions:"Dip then drive overhead.",
 video:"https://www.youtube.com/watch?v=iaBVSJm78ko"
}

};

let logs = JSON.parse(localStorage.getItem("logs") || "{}");
let currentDay="Day 1";
let view="workout";
let openInfo=null;

let current = {
 weight:100,
 reps:8,
 rpe:8,
 speed:3,
 incline:5
};

function toggleInfo(ex){
 openInfo = openInfo === ex ? null : ex;
 render();
}

function setDay(d){
 currentDay = d;
 render();
}

function adjust(field,val){
 current[field]+=val;
 render();
}

function isCardio(ex){
 return currentDay==="Day 3" && ex==="Incline Treadmill Walk";
}

function logSet(ex){
 if(!logs[currentDay]) logs[currentDay]={};
 if(!logs[currentDay][ex]) logs[currentDay][ex]=[];

 let entry = isCardio(ex)
 ? {speed:current.speed,incline:current.incline}
 : {weight:current.weight,reps:current.reps,rpe:current.rpe};

 logs[currentDay][ex].push(entry);
 localStorage.setItem("logs", JSON.stringify(logs));
 render();
}

function render(){

 let html="";

 if(view==="workout"){

  for(let d in workouts){
   html+=`<button class="day-btn ${d===currentDay?'active':''}" onclick="setDay('${d}')">${d}</button>`;
  }

  workouts[currentDay].forEach(ex=>{

   html+=`<div class="card">`;

   html+=`
   <div class="row">
    <b>${ex}</b>
    <button onclick="toggleInfo('${ex}')">ⓘ</button>
   </div>`;

   if(openInfo===ex){
    html+=`
    <div class="info-box">
      ${info[ex]?.instructions || "Instructions coming soon"}
      ${info[ex]?.video
        ? `<br><button onclick="window.open('${info[ex].video}','_blank')">▶ Watch Tutorial</button>`
        : ""
      }
    </div>`;
   }

   let last = logs[currentDay]?.[ex]?.slice(-1)[0];

   if(last){
    html+=`<div class="small">
      ${last.speed
        ? `${last.speed} mph / ${last.incline}%`
        : `${last.weight} x ${last.reps} (RPE ${last.rpe || "-"})`
      }
    </div>`;
   }

   if(isCardio(ex)){
    html+=`
    <div class="row"><span>Speed ${current.speed}</span>
    <div><button onclick="adjust('speed',.1)">+</button><button onclick="adjust('speed',-.1)">-</button></div></div>

    <div class="row"><span>Incline ${current.incline}</span>
    <div><button onclick="adjust('incline',1)">+</button><button onclick="adjust('incline',-1)">-</button></div></div>
    `;
   }
   else{
    html+=`
    <div class="row"><span>Weight ${current.weight}</span>
    <div><button onclick="adjust('weight',5)">+</button><button onclick="adjust('weight',-5)">-</button></div></div>

    <div class="row"><span>Reps ${current.reps}</span>
    <div><button onclick="adjust('reps',1)">+</button><button onclick="adjust('reps',-1)">-</button></div></div>

    <div class="row"><span>RPE</span>
    <div>${[6,7,8,9].map(r=>`<button onclick="current.rpe=${r};render()">${r}</button>`).join("")}</div></div>
    `;
   }

   html+=`<button onclick="logSet('${ex}')">Log</button>`;
   html+=`</div>`;
  });
 }

 if(view==="audit"){
  html="<h3>Progress</h3>";
  for(let d in workouts){
   workouts[d].forEach(ex=>{
    let last = logs[d]?.[ex]?.slice(-1)[0];
    if(last){
      html+=`<div class="small">${ex}: ${
        last.speed ? `${last.speed}/${last.incline}` : `${last.weight}x${last.reps}`
      }</div>`;
    }
   });
  }
 }

 document.getElementById("app").innerHTML = html;
}

render();

</script>
</body>
</html>
``
