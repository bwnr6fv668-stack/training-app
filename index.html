<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Training App</title>

<style>
body {
  font-family: -apple-system, Arial;
  max-width: 500px;
  margin: auto;
  padding: 12px;
  background: #f5f7fb;
}

h2 { text-align: center; }

button {
  border: none;
  border-radius: 6px;
  padding: 6px 8px;
  margin: 3px;
  background: #2563eb;
  color: white;
  font-size: 13px;
}

.day-btn { background:#ddd; color:black; }
.active { background:#2563eb; color:white; }

.card {
  background:white;
  border-radius:10px;
  padding:10px;
  margin-bottom:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.row {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.small { font-size:12px; color:#666; }

.info-box {
  background:#eef3ff;
  padding:6px;
  border-radius:6px;
  margin-top:6px;
}
</style>

</head>
<body>

<h2>🏋️ Training</h2>

<div>
<button onclick="view='workout';render()">Workout</button>
<button onclick="view='audit';render()">Audit</button>
</div>

<div id="app"></div>

<script>

const workouts = {
 "Day 1":[
  "Incline DB Bench (Neutral Grip)",
  "Half-Kneeling Landmine Press",
  "DB Fly (Short Range)",
  "Lateral Raise",
  "Triceps Pressdown"
 ],
 "Day 2":[
  "Goblet Squat to Box",
  "Romanian Deadlift",
  "Reverse Lunge",
  "Hip Thrust / Glute Bridge",
  "Pallof Press"
 ],
 "Day 3":[
  "Incline Treadmill Walk",
  "Kettlebell Swing"
 ],
 "Day 4":[
  "Chest-Supported DB Row",
  "Neutral-Grip Pulldown",
  "Face Pull",
  "Hammer Curl",
  "Farmer's Carry"
 ],
 "Day 5":[
  "Complex Deadlift",
  "Complex Row",
  "Complex Clean",
  "Complex Front Squat",
  "Complex Push Press",
  "Kettlebell Swing"
 ]
};

const info = {

"Incline DB Bench (Neutral Grip)": {
instructions:"Bench at ~30°. Neutral grip. Lower under control, slight elbow tuck, press through upper chest."
},

"Half-Kneeling Landmine Press": {
instructions:"Half kneeling stance. Brace core, press upward and slightly forward without leaning back."
},

"DB Fly (Short Range)": {
instructions:"Keep slight bend in arms. Lower only to comfortable stretch, squeeze chest at top."
},

"Lateral Raise": {
instructions:"Raise arms to shoulder height, lead with elbows, control the descent."
},

"Triceps Pressdown": {
instructions:"Elbows pinned to sides, extend fully, control back up slowly."
},

"Goblet Squat to Box": {
instructions:"Sit back to box, keep chest tall, drive through heels to stand."
},

"Romanian Deadlift": {
instructions:"Push hips back, slight knee bend, keep bar close, feel stretch in hamstrings."
},

"Reverse Lunge": {
instructions:"Step back, drop knee toward floor, drive through front leg to stand."
},

"Hip Thrust / Glute Bridge": {
instructions:"Drive hips upward, squeeze glutes at top, avoid arching lower back."
},

"Pallof Press": {
instructions:"Press straight out from chest, resist rotation, keep core tight."
},

"Incline Treadmill Walk": {
instructions:"Maintain upright posture, steady pace, controlled breathing."
},

"Kettlebell Swing": {
instructions:"Hinge at hips, snap hips forward to drive bell, arms relaxed."
},

"Chest-Supported DB Row": {
instructions:"Chest on bench, pull elbows toward hips, squeeze shoulder blades."
},

"Neutral-Grip Pulldown": {
instructions:"Pull to upper chest, elbows down, control back up."
},

"Face Pull": {
instructions:"Pull toward face, elbows high, squeeze rear delts."
},

"Hammer Curl": {
instructions:"Neutral grip, control both up and down, no swinging."
},

"Farmer's Carry": {
instructions:"Stand tall, shoulders packed, slow controlled steps."
},

"Complex Deadlift": {
instructions:"Maintain tight core, controlled lift, reset position each rep."
},

"Complex Row": {
instructions:"Hinge position, pull bar toward torso, control motion."
},

"Complex Clean": {
instructions:"Explosive hip drive, catch smoothly, stay balanced."
},

"Complex Front Squat": {
instructions:"Elbows high, chest upright, drive knees out."
},

"Complex Push Press": {
instructions:"Dip slightly then explode upward, press overhead."
}
};

let logs = JSON.parse(localStorage.getItem("logs") || "{}");
let currentDay="Day 1";
let view="workout";
let openInfo=null;

let current = {
 weight:100,
 reps:8,
 rpe:8,
 speed:3,
 incline:5
};

function toggleInfo(ex){
 openInfo = openInfo === ex ? null : ex;
 render();
}

function setDay(d){
 currentDay = d;
 render();
}

function adjust(field,val){
 current[field]+=val;
 render();
}

function isCardio(ex){
 return currentDay==="Day 3" && ex==="Incline Treadmill Walk";
}

function logSet(ex){
 if(!logs[currentDay]) logs[currentDay]={};
 if(!logs[currentDay][ex]) logs[currentDay][ex]=[];

 let entry = isCardio(ex)
 ? {speed:current.speed,incline:current.incline}
 : {weight:current.weight,reps:current.reps,rpe:current.rpe};

 logs[currentDay][ex].push(entry);
 localStorage.setItem("logs", JSON.stringify(logs));
 render();
}

function render(){

 let html="";

 if(view==="workout"){

  for(let d in workouts){
   html+=`<button class="day-btn ${d===currentDay?'active':''}" onclick="setDay('${d}')">${d}</button>`;
  }

  workouts[currentDay].forEach(ex=>{

   html+=`<div class="card">`;

   html+=`
   <div class="row">
    <b>${ex}</b>
    <button onclick="toggleInfo('${ex}')">ⓘ</button>
   </div>`;

   if(openInfo===ex){
    html+=`
    <div class="info-box">
      ${info[ex]?.instructions || "Instructions coming soon"}
    </div>`;
   }

   let last = logs[currentDay]?.[ex]?.slice(-1)[0];

   if(last){
    html+=`<div class="small">
      ${last.speed
        ? `${last.speed} mph / ${last.incline}%`
        : `${last.weight} x ${last.reps} (RPE ${last.rpe || "-"})`
      }
    </div>`;
   }

   if(isCardio(ex)){
    html+=`
    <div class="row"><span>Speed ${current.speed}</span>
    <div>
    <button onclick="adjust('speed',.1)">+</button>
    <button onclick="adjust('speed',-.1)">-</button>
    </div></div>

    <div class="row"><span>Incline ${current.incline}</span>
    <div>
    <button onclick="adjust('incline',1)">+</button>
    <button onclick="adjust('incline',-1)">-</button>
    </div></div>
    `;
   }
   else{
    html+=`
    <div class="row"><span>Weight ${current.weight}</span>
    <div><button onclick="adjust('weight',5)">+</button><button onclick="adjust('weight',-5)">-</button></div></div>

    <div class="row"><span>Reps ${current.reps}</span>
    <div><button onclick="adjust('reps',1)">+</button><button onclick="adjust('reps',-1)">-</button></div></div>

    <div class="row"><span>RPE</span>
    <div>${[6,7,8,9].map(r=>`<button onclick="current.rpe=${r};render()">${r}</button>`).join("")}</div></div>
    `;
   }

   html+=`<button onclick="logSet('${ex}')">Log</button>`;

   html+=`</div>`;
  });
 }

 if(view==="audit"){
  html="<h3>Progress</h3>";

  for(let d in workouts){
   workouts[d].forEach(ex=>{
    let last = logs[d]?.[ex]?.slice(-1)[0];
    if(last){
      html+=`<div class="small">${ex}: ${
        last.speed ? `${last.speed}/${last.incline}` : `${last.weight}x${last.reps}`
      }</div>`;
    }
   });
  }
 }

 document.getElementById("app").innerHTML = html;
}

render();

</script>
</body>
</html>
