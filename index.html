body {
  font-family: -apple-system, Arial;
  background: #f8fafc;
  max-width: 480px;
  margin: auto;
  padding: 16px;
}

/* ✅ HEADER */
.header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.logo {
  width: 32px;
  height: 32px;
  border-radius: 8px;
}

.title {
  font-size: 18px;
  font-weight: 600;
}

/* ✅ DAYS */
.day-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  margin-bottom: 16px;
}

.day-btn {
  padding: 8px 12px;
  background: #e5e7eb;
  border-radius: 999px;
  font-size: 13px;
  white-space: nowrap;
}

.active {
  background: #2563eb;
  color: white;
}

/* ✅ CARD (clean, not boxy) */
.card {
  padding: 12px 0;
  border-bottom: 1px solid #e5e7eb;
}

/* ✅ ROW */
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* ✅ SMALL TEXT */
.small {
  font-size: 12px;
  color: #6b7280;
  margin-top: 4px;
}

/* ✅ BUTTONS */
button {
  border: none;
  border-radius: 8px;
  padding: 8px 10px;
  background: #2563eb;
  color: white;
  font-size: 13px;
}
