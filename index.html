
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Training App</title>

<style>
body {
  font-family: -apple-system, Arial;
  max-width: 500px;
  margin: auto;
  padding: 12px;
  background: #f5f7fb;
}

h2 { text-align: center; }

button {
  border: none;
  border-radius: 6px;
  padding: 6px 8px;
  margin: 3px;
  background: #2563eb;
  color: white;
  font-size: 13px;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.small { font-size: 12px; color:#666; }

.info {
  font-size: 12px;
  background: #eef3ff;
  padding: 6px;
  border-radius: 6px;
  margin-top: 6px;
}

.controls { margin-top: 6px; }
</style>

</head>

<body>

<h2>🏋️ Training App</h2>

<div>
<button onclick="view='workout';render()">Workout</button>
<button onclick="view='audit';render()">Audit</button>
</div>

<div id="app"></div>

<script>

const workouts = {
 "Day 1":[
  "Incline DB Bench (Neutral Grip)",
  "Half‑Kneeling Landmine Press",
  "DB Fly (Short Range)",
  "Lateral Raise",
  "Triceps Pressdown"
 ],
 "Day 2":[
  "Goblet Squat to Box",
  "Romanian Deadlift",
  "Reverse Lunge",
  "Hip Thrust / Glute Bridge",
  "Pallof Press"
 ],
 "Day 3":[
  "Incline Treadmill Walk",
  "Kettlebell Swing"
 ],
 "Day 4":[
  "Chest‑Supported DB Row",
  "Neutral‑Grip Pulldown",
  "Face Pull",
  "Hammer Curl",
  "Farmer’s Carry"
 ],
 "Day 5":[
  "Complex – Deadlift",
  "Complex – Bent‑Over Row",
  "Complex – Hang Clean",
  "Complex – Front Squat",
  "Complex – Push Press",
  "Kettlebell Swing"
 ]
};

const info = {
 "Incline DB Bench (Neutral Grip)": {
  instructions: "Control the descent, slight elbow tuck, drive through chest.",
  video: "https://www.youtube.com/watch?v=8iPEnn-ltC8"
 },
 "Romanian Deadlift": {
  instructions: "Push hips back, keep bar close, don't round back.",
  video: "https://www.youtube.com/watch?v=jc1ogzTe1cA"
 },
 "Incline Treadmill Walk": {
  instructions: "Maintain tall posture, steady breathing, moderate incline.",
  video: ""
 }
};

let logs = JSON.parse(localStorage.getItem("logs") || "{}");
let currentDay = "Day 1";
let view = "workout";

let current = {
 weight: 100,
 reps: 8,
 rpe: 8,
 speed: 3.0,
 incline: 5
};

function save(){
 localStorage.setItem("logs", JSON.stringify(logs));
}

function adjust(field, val){
 current[field] = Math.max(0, current[field] + val);
 render();
}

function isCardio(ex){
 return currentDay === "Day 3" && ex === "Incline Treadmill Walk";
}

function toggleInfo(id){
 const el = document.getElementById(id);
 el.style.display = el.style.display === "none" ? "block" : "none";
}

function logSet(ex){

 if(!logs[currentDay]) logs[currentDay] = {};
 if(!logs[currentDay][ex]) logs[currentDay][ex] = [];

 let entry;

 if(isCardio(ex)){
  entry = { speed: current.speed, incline: current.incline };
 }
 else{
  entry = {
   weight: current.weight,
   reps: current.reps,
   rpe: current.rpe,
   score: current.weight * current.reps
  };
 }

 logs[currentDay][ex].push(entry);
 save();
 render();
}

function render(){

 let html = "";

 if(view === "workout"){

  for(let d in workouts){
   html += `<button onclick="currentDay='${d}';render()">${d}</button>`;
  }

  workouts[currentDay].forEach(ex => {

   let id = ex.replace(/[^a-z0-9]/gi,"");

   html += `<div class="card"><b>${ex}</b>
   <button onclick="toggleInfo('${id}')">ⓘ</button>`;

   if(info[ex]){
     html += `<div id="${id}" class="info" style="display:none">
       ${info[ex].instructions || ""}
       ${info[ex].video ? `<br>${info[ex].video}▶ Video</a>` : ""}
     </div>`;
   }

   let last = logs[currentDay]?.[ex]?.slice(-1)[0];

   if(last){
     if(last.speed){
       html += `<div class="small">Last: ${last.speed} mph / ${last.incline}%</div>`;
     } else {
       html += `<div class="small">Last: ${last.weight} x ${last.reps}</div>`;
     }
   }

   if(isCardio(ex)){
     html += `
       <div class="controls">
         Speed ${current.speed}
         <button onclick="adjust('speed',.1)">+</button>
         <button onclick="adjust('speed',-.1)">-</button>
       </div>
       <div class="controls">
         Incline ${current.incline}
         <button onclick="adjust('incline',1)">+</button>
         <button onclick="adjust('incline',-1)">-</button>
       </div>
     `;
   } else {

     html += `
       <div class="controls">
         W ${current.weight}
         <button onclick="adjust('weight',5)">+</button>
         <button onclick="adjust('weight',-5)">-</button>
       </div>

       <div class="controls">
         R ${current.reps}
         <button onclick="adjust('reps',1)">+</button>
         <button onclick="adjust('reps',-1)">-</button>
       </div>
     `;
   }

   html += `<button onclick="logSet('${ex}')">Log</button>`;

   let sets = logs[currentDay]?.[ex] || [];

   sets.forEach(s => {
     if(s.speed){
       html += `<div class="small">${s.speed} mph / ${s.incline}%</div>`;
     } else {
       html += `<div class="small">${s.weight} x ${s.reps}</div>`;
     }
   });

   html += `</div>`;
  });
 }

 if(view === "audit"){
  html = "<h3>Progress</h3>";

  for(let d in workouts){
   workouts[d].forEach(ex=>{
     let last = logs[d]?.[ex]?.slice(-1)[0];
     if(last){
       if(last.speed){
         html += `<div class="small">${ex}: ${last.speed} / ${last.incline}%</div>`;
       } else {
         html += `<div class="small">${ex}: ${last.weight} x ${last.reps}</div>`;
       }
     }
   });
  }
 }

 document.getElementById("app").innerHTML = html;
}

render();

</script>

</body>
</html>
