<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Training App</title>

<style>
body {
  font-family: -apple-system, Arial;
  background: #f2f4f7;
  padding: 10px;
  max-width: 480px;
  margin: auto;
}

h2 {
  text-align:center;
  margin-bottom:10px;
}

button {
  border:none;
  border-radius:8px;
  padding:8px;
  margin:3px;
  background:#2563eb;
  color:white;
  font-size:14px;
}

.card {
  background:white;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.row {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.small {
  font-size:12px;
  color:#777;
}

.video {
  width:100%;
  margin-top:8px;
  border-radius:8px;
}
</style>
</head>

<body>

<h2>🏋️ Training</h2>

<div id="top"></div>
<div id="app"></div>

<script>

const workouts = {
 "Day 1":[
  "Incline DB Bench (Neutral Grip)",
  "Half-Kneeling Landmine Press",
  "DB Fly (Short Range)",
  "Lateral Raise",
  "Triceps Pressdown"
 ],
 "Day 2":[
  "Goblet Squat to Box",
  "Romanian Deadlift",
  "Reverse Lunge",
  "Hip Thrust / Glute Bridge",
  "Pallof Press"
 ],
 "Day 3":[
  "Incline Treadmill Walk",
  "Kettlebell Swing"
 ],
 "Day 4":[
  "Chest-Supported DB Row",
  "Neutral-Grip Pulldown",
  "Face Pull",
  "Hammer Curl",
  "Farmer's Carry"
 ],
 "Day 5":[
  "Complex Deadlift",
  "Complex Row",
  "Complex Clean",
  "Complex Front Squat",
  "Complex Push Press",
  "Kettlebell Swing"
 ]
};

// ✅ safe index-based info
const info = {
  "Incline DB Bench (Neutral Grip)": { video:"8iPEnn-ltC8" },
  "Romanian Deadlift": { video:"jc1ogzTe1cA" },
  "Kettlebell Swing": { video:"YSxHifyI1lA" },
  "Face Pull": { video:"rep-qVOkqgk" }
};

let logs = JSON.parse(localStorage.getItem("logs") || "{}");

let currentDay="Day 1";
let openInfo=null;

let current = {
 weight:100,
 reps:8,
 rpe:8,
 speed:3,
 incline:5
};

function setDay(d){
 currentDay=d;
 render();
}

function toggleInfo(ex){
 openInfo = openInfo===ex ? null : ex;
 render();
}

function adjust(field,val){
 current[field]+=val;
 render();
}

function isCardio(ex){
 return currentDay==="Day 3" && ex==="Incline Treadmill Walk";
}

function logSet(ex){

 if(!logs[currentDay]) logs[currentDay]={};
 if(!logs[currentDay][ex]) logs[currentDay][ex]=[];

 const entry = isCardio(ex)
 ? {speed:current.speed,incline:current.incline}
 : {weight:current.weight,reps:current.reps,rpe:current.rpe};

 logs[currentDay][ex].push(entry);

 localStorage.setItem("logs", JSON.stringify(logs));
 render();
}

function render(){

 let top = "";

 // top nav
 top += `<button onclick="currentDay='Day 1';render()">Day 1</button>`;
 top += `<button onclick="currentDay='Day 2';render()">Day 2</button>`;
 top += `<button onclick="currentDay='Day 3';render()">Day 3</button>`;
 top += `<button onclick="currentDay='Day 4';render()">Day 4</button>`;
 top += `<button onclick="currentDay='Day 5';render()">Day 5</button>`;

 document.getElementById("top").innerHTML = top;

 let html="";

 workouts[currentDay].forEach(ex=>{

  html += `<div class="card">`;

  html += `
  <div class="row">
    <b>${ex}</b>
    <button onclick="toggleInfo('${ex}')">ⓘ</button>
  </div>
  `;

  if(openInfo===ex){
    html += `
    <div class="small">
      ${
        info[ex]?.video
        ? `<iframe class="video" src="https://www.youtube.com       : "No video yet"
      }
    </div>`;
  }

  const last = logs[currentDay]?.[ex]?.slice(-1)[0];

  if(last){
    html += `<div class="small">
      ${last.speed
        ? `${last.speed}/${last.incline}`
        : `${last.weight}x${last.reps}`}
    </div>`;
  }

  if(isCardio(ex)){
    html += `
      <div class="row">Speed ${current.speed}
        <button onclick="adjust('speed',.1)">+</button>
        <button onclick="adjust('speed',-.1)">-</button>
      </div>
      <div class="row">Incline ${current.incline}
        <button onclick="adjust('incline',1)">+</button>
        <button onclick="adjust('incline',-1)">-</button>
      </div>
    `;
  } else {
