<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Training App</title>

<style>
body {
  font-family: -apple-system, Arial;
  background: #f2f4f7;
  margin: 0;
  padding: 10px;
  max-width: 480px;
  margin: auto;
}

h2 { text-align:center; }

button {
  border:none;
  border-radius:8px;
  padding:10px;
  margin:4px;
  font-size:14px;
  background:#2563eb;
  color:white;
}

.card {
  background:white;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.title-row {
  display:flex;
  justify-content:space-between;
}

.small {
  font-size:12px;
  color:#777;
  margin-top:4px;
}

.controls { margin-top:8px; }

.control-row {
  display:flex;
  justify-content:space-between;
  margin-top:5px;
}

.video {
  width:100%;
  margin-top:10px;
  border-radius:10px;
}

.active { background:#2563eb; color:white; }
.day-btn { background:#ddd; color:black; }

.info-box {
  background:#eef3ff;
  padding:8px;
  border-radius:8px;
  margin-top:8px;
}
</style>

</head>
<body>

<h2>🏋️ Training</h2>

<div>
<button onclick="view='workout';render()">Workout</button>
<button onclick="view='audit';render()">Audit</button>
</div>

<div id="app"></div>

<script>

const workouts = {
 "Day 1":["Incline DB Bench (Neutral Grip)","Half-Kneeling Landmine Press","DB Fly (Short Range)","Lateral Raise","Triceps Pressdown"],
 "Day 2":["Goblet Squat to Box","Romanian Deadlift","Reverse Lunge","Hip Thrust / Glute Bridge","Pallof Press"],
 "Day 3":["Incline Treadmill Walk","Kettlebell Swing"],
 "Day 4":["Chest-Supported DB Row","Neutral-Grip Pulldown","Face Pull","Hammer Curl","Farmer's Carry"],
 "Day 5":["Complex Deadlift","Complex Row","Complex Clean","Complex Front Squat","Complex Push Press","Kettlebell Swing"]
};

const info = {
 "Incline DB Bench (Neutral Grip)": {
  instructions:"Upper chest press with neutral grip.",
  video:"8iPEnn-ltC8"
 },
 "Romanian Deadlift": {
  instructions:"Hip hinge, stretch hamstrings.",
  video:"jc1ogzTe1cA"
 },
 "Kettlebell Swing": {
  instructions:"Explosive hip hinge movement.",
  video:"YSxHifyI1lA"
 }
};

let logs = JSON.parse(localStorage.getItem("logs") || "{}");

let currentDay="Day 1";
let view="workout";
let openInfo=null;
let openVideo=null;

let current = {
 weight:100, reps:8, rpe:8,
 speed:3, incline:5
};

function toggleInfo(ex){
 openInfo = openInfo===ex ? null : ex;
 openVideo=null;
 render();
}

function toggleVideo(ex){
 openVideo = openVideo===ex ? null : ex;
 render();
}

function setDay(d){
 currentDay=d;
 render();
}

function adjust(field,val){
 current[field]+=val;
 render();
}

function isCardio(ex){
 return currentDay==="Day 3" && ex==="Incline Treadmill Walk";
}

function logSet(ex){
 if(!logs[currentDay]) logs[currentDay]={};
 if(!logs[currentDay][ex]) logs[currentDay][ex]=[];

 let entry = isCardio(ex)
 ? {speed:current.speed,incline:current.incline}
 : {weight:current.weight,reps:current.reps,rpe:current.rpe};

 logs[currentDay][ex].push(entry);
 localStorage.setItem("logs", JSON.stringify(logs));
 render();
}

function render(){

 let html="";

 if(view==="workout"){

  for(let d in workouts){
   html+=`<button class="${d===currentDay?'active day-btn':'day-btn'}" onclick="setDay('${d}')">${d}</button>`;
  }

  workouts[currentDay].forEach(ex=>{

   html+=`<div class="card">`;

   html+=`
   <div class="title-row">
    <b>${ex}</b>
    <button onclick="toggleInfo('${ex}')">ⓘ</button>
   </div>
   `;

   if(openInfo===ex){
    html+=`
    <div class="info-box">
      ${info[ex]?.instructions || "No instructions yet"}

      ${info[ex]?.video
        ? `<br><button onclick="toggleVideo('${ex}')">▶ Watch</button>`
        : ""
      }

      ${
        openVideo===ex
        ? `<iframe class="video" src="https://www.youtube.com/embed/${info[ex].video}" frameborder="0;
   }

   let last = logs[currentDay]?.[ex]?.slice(-1)[0];

   if(last){
    html+=`<div class="small">
      ${last.speed
        ? `${last.speed} mph / ${last.incline}%`
        : `${last.weight} x ${last.reps}`
      }
    </div>`;
   }

   html+=`<div class="controls">`;

   if(isCardio(ex)){
    html+=`
    <div class="control-row">
      Speed ${current.speed}
      <div>
        <button onclick="adjust('speed',.1)">+</button>
        <button onclick="adjust('speed',-.1)">-</button>
      </div>
    </div>

    <div class="control-row">
      Incline ${current.incline}
      <div>
        <button onclick="adjust('incline',1)">+</button>
        <button onclick="adjust('incline',-1)">-</button>
      </div>
    </div>`;
   } else {
    html+=`
    <div class="control-row">
      Weight ${current.weight}
      <div>
        <button onclick="adjust('weight',5)">+</button>
        <button onclick="adjust('weight',-5)">-</button>
      </div>
    </div>

    <div class="control-row">
      Reps ${current.reps}
      <div>
        <button onclick="adjust('reps',1)">+</button>
        <button onclick="adjust('reps',-1)">-</button>
      </div>
    </div>`;
   }

   html+=`</div>`;
   html+=`<button onclick="logSet('${ex}')">Log Set</button>`;
   html+=`</div>`;
  });
 }

 document.getElementById("app").innerHTML=html;
}

render();
</script>
</body>
</html>
