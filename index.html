<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Training App</title>

<style>
body {
  font-family: -apple-system, Arial;
  padding: 12px;
  max-width: 500px;
  margin: auto;
  background: #f5f5f5;
}

h2 { text-align:center; }

button {
  border:none;
  border-radius:6px;
  padding:6px 8px;
  margin:3px;
  background:#2563eb;
  color:white;
}

.card {
  background:white;
  border-radius:8px;
  padding:10px;
  margin-bottom:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.small { font-size:12px; color:#666; }

.info {
  background:#eef3ff;
  padding:5px;
  border-radius:5px;
  margin-top:5px;
}
</style>
</head>

<body>

<h2>🏋️ Training</h2>

<button onclick="view='workout';render()">Workout</button>
<button onclick="view='audit';render()">Audit</button>

<div id="app"></div>

<script>

const workouts = {
 "Day 1":[
  "Incline DB Bench",
  "Landmine Press",
  "DB Fly",
  "Lateral Raise",
  "Triceps Pressdown"
 ],
 "Day 2":[
  "Goblet Squat",
  "RDL",
  "Reverse Lunge",
  "Hip Thrust",
  "Pallof Press"
 ],
 "Day 3":[
  "Incline Walk",
  "Kettlebell Swing"
 ],
 "Day 4":[
  "Row",
  "Pulldown",
  "Face Pull",
  "Hammer Curl",
  "Farmer Carry"
 ],
 "Day 5":[
  "Deadlift",
  "Bent Row",
  "Hang Clean",
  "Front Squat",
  "Push Press",
  "Kettlebell Swing"
 ]
};

let logs = JSON.parse(localStorage.getItem("logs") || "{}");

let currentDay="Day 1";
let view="workout";

let current = {
 weight:100,
 reps:8,
 rpe:8,
 speed:3,
 incline:5
};

function save(){
 localStorage.setItem("logs",JSON.stringify(logs));
}

function adjust(field,val){
 current[field]=Math.max(0,current[field]+val);
 render();
}

function isCardio(ex){
 return currentDay=="Day 3" && ex=="Incline Walk";
}

function logSet(ex){
 if(!logs[currentDay]) logs[currentDay]={};
 if(!logs[currentDay][ex]) logs[currentDay][ex]=[];

 let entry;

 if(isCardio(ex)){
   entry={speed:current.speed,incline:current.incline};
 } else {
   entry={
     weight:current.weight,
     reps:current.reps,
     rpe:current.rpe,
     score:current.weight*current.reps
   };
 }

 logs[currentDay][ex].push(entry);
 save();
 render();
}

function render(){

 let html="";

 if(view=="workout"){

  for(let d in workouts){
   html+=`<button onclick="currentDay='${d}';render()">${d}</button>`;
  }

  workouts[currentDay].forEach(ex=>{

   html+=`<div class="card"><b>${ex}</b>`;

   if(isCardio(ex)){

    html+=`
    <div>
     Speed ${current.speed}
     <button onclick="adjust('speed',.1)">+</button>
     <button onclick="adjust('speed',-.1)">-</button>
    </div>

    <div>
     Incline ${current.incline}
     <button onclick="adjust('incline',1)">+</button>
     <button onclick="adjust('incline',-1)">-</button>
    </div>
    `;

   } else {

    html+=`
    <div>
     Weight ${current.weight}
     <button onclick="adjust('weight',5)">+</button>
     <button onclick="adjust('weight',-5)">-</button>
    </div>

    <div>
     Reps ${current.reps}
     <button onclick="adjust('reps',1)">+</button>
     <button onclick="adjust('reps',-1)">-</button>
    </div>

    <div>
     ${[6,7,8,9].map(r =>
      `<button onclick="current.rpe=${r};render()">${r}</button>`
     ).join("")}
    </div>
    `;
   }

   html+=`<button onclick="logSet('${ex}')">Log</button>`;

   let sets=logs[currentDay]?.[ex]||[];

   sets.forEach(s=>{
    if(s.speed){
     html+=`<div class="small">${s.speed} mph / ${s.incline}%</div>`;
    } else {
     html+=`<div class="small">${s.weight} x ${s.reps}</div>`;
    }
   });

   html+="</div>";
  });

 }

 if(view=="audit"){
  html="<h3>Progress</h3>";

  for(let d in workouts){
   workouts[d].forEach(ex=>{
    let sets=logs[d]?.[ex]||[];
    if(sets.length){
     let last=sets[sets.length-1];

     if(last.speed){
      html+=`<div class="small">${ex}: ${last.speed} mph / ${last.incline}%</div>`;
     } else {
      html+=`<div class="small">${ex}: ${last.weight} x ${last.reps}</div>`;
     }
    }
   });
  }

 }

 document.getElementById("app").innerHTML=html;
}

render();

</script>
</body>
</html>
